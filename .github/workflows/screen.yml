name: daily-screen

on:
  schedule:
    - cron: "37 8 * * 1-5"   # 평일 17:37 KST
    - cron: "52 8 * * 1-5"   # 평일 17:52 KST (백업)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["screener.py", "indicators.py", "sectors.py", "notify.py", "requirements.txt", ".github/workflows/screen.yml"]

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - id: run
        run: python screener.py
      - name: Commit result
        if: steps.run.outputs.skip != 'true'
        run: |
          git config user.name "screen-bot"
          git config user.email "screen-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "screen $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main && git push
      - name: 카카오톡·메일 발송
        if: steps.run.outputs.skip != 'true' && github.event_name != 'push'
        env:
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python notify.py
