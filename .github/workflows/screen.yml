name: daily-screen

on:
  schedule:
    - cron: "35 6 * * 1-5"   # 평일 15:35 KST (GitHub 사정으로 5~20분 늦을 수 있음)
  workflow_dispatch: {}       # Actions 탭에서 수동 실행
  push:                       # 스크리너 코드가 바뀌면 바로 한 번 실행
    branches: [main]
    paths: ["screener.py", "indicators.py", "requirements.txt", ".github/workflows/screen.yml"]

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python screener.py
      - name: Commit result
        run: |
          git config user.name "screen-bot"
          git config user.email "screen-bot@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "screen $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main && git push
